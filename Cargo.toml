[package]
name = "mettle"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A resilience toolkit for Rust: async and blocking retries with configurable backoff."
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["retry", "backoff", "resilience", "async", "tokio"]
categories = ["asynchronous", "network-programming"]
repository = "https://github.com/azeemshaik025/mettle"
documentation = "https://docs.rs/mettle"
exclude = ["docs", "learning"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
tokio = { version = "1", features = ["time"], optional = true }
pin-project-lite = { version = "0.2", optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[features]
default = ["async", "blocking"]
async = ["dep:tokio", "dep:pin-project-lite"]
blocking = []

[[example]]
name = "retry"
required-features = ["async"]

[[example]]
name = "blocking_retry"
required-features = ["blocking"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
